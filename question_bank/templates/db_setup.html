{% extends "base.html" %}
{% block title %}SQLite 数据库 - 高中数学题库导入导出系统{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>SQLite 数据库不可用</h1>
    <p>当前目标：{{ storage }}</p>
  </div>
</header>

<section class="panel">
  <h2>连接失败</h2>
  <pre class="error-box">{{ error }}</pre>
  <p>请确认项目目录可写，并检查 <code>.env</code> 中的 SQLite 路径：</p>
  <pre class="code-box">DB_DRIVER=sqlite
SQLITE_PATH=data/question_bank.db</pre>
  <p>修复目录权限后重新运行 <code>start.bat</code>。系统会自动创建数据库和表。</p>
</section>
{% endblock %}
